<!DOCTYPE html>
<html>
<head>
    <title>Flask Todo App</title>
    <style>
        form { margin: 20px; }
        label { display: block; margin: 10px 0; }
        input, textarea { width: 100%; padding: 8px; }
        button { padding: 10px 20px; }
    </style>
</head>
<body>
    <h1>Todo App</h1>
    <form id="todoForm" onsubmit="submitTodo(event)">
        <label for="itemId">Item ID:</label>
        <input type="text" id="itemId" name="itemId" required>
        <label for="itemUuid">Item UUID:</label>
        <input type="text" id="itemUuid" name="itemUuid" value="" readonly>
        <label for="itemName">Item Name:</label>
        <input type="text" id="itemName" name="itemName" required>
        <label for="itemDescription">Item Description:</label>
        <textarea id="itemDescription" name="itemDescription" required></textarea>
        <button type="submit">Submit</button>
    </form>
    <script>
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        document.getElementById('itemUuid').value = generateUUID();
        async function submitTodo(event) {
            event.preventDefault();
            const itemId = document.getElementById('itemId').value;
            const itemUuid = document.getElementById('itemUuid').value;
            const itemName = document.getElementById('itemName').value;
            const itemDescription = document.getElementById('itemDescription').value;
            const response = await fetch('/submittodoitem', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ itemId, itemUuid, itemName, itemDescription })
            });
            const result = await response.json();
            alert(result.message);
        }
    </script>
</body>
</html>
